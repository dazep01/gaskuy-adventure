<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Access Denied - 403</title>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: rgba(200, 255, 0);
            --bg: #0a0a0a;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg);
            color: #fff;
            font-family: 'Share Tech Mono', monospace;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }

        /* Background Grid Effect */
        body::before {
            content: "";
            position: absolute;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(rgba(200, 255, 0, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(200, 255, 0, 0.05) 1px, transparent 1px);
            background-size: 50px 50px;
            z-index: -1;
        }

        .container {
            text-align: center;
            padding: 40px;
            border: 1px solid rgba(200, 255, 0, 0.3);
            background: #5a4f4150;
            backdrop-filter: blur(10px);
            border-radius: 20px;
            box-shadow: 0 0 50px rgba(200, 255, 0, 0.2);
            max-width: 600px;
            width: 90%;
        }

        .error-code {
            font-size: 8rem;
            font-weight: bold;
            color: var(--primary);
            text-shadow: 0 0 20px rgba(200, 255, 0, 0.5);
            animation: glitch 1s infinite;
            margin-bottom: 0;
        }

        .radar {
            width: 120px;
            height: 120px;
            margin: 20px auto;
            border: 2px solid var(--primary);
            border-radius: 50%;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .radar::after {
            content: "";
            position: absolute;
            width: 100%;
            height: 100%;
            border: 2px solid var(--primary);
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        h2 {
            font-size: 1.5rem;
            margin-bottom: 20px;
            letter-spacing: 3px;
            color: var(--primary);
        }

        p {
            font-size: 1rem;
            line-height: 1.6;
            margin-bottom: 30px;
            color: #ccc;
        }

        .btn-back {
            display: inline-block;
            padding: 12px 30px;
            border: 1px solid var(--primary);
            color: var(--primary);
            text-decoration: none;
            transition: all 0.3s;
            text-transform: uppercase;
            font-weight: bold;
            letter-spacing: 2px;
        }

        .btn-back:hover {
            background: var(--primary);
            color: #000;
            box-shadow: 0 0 20px var(--primary);
        }

        /* Animations */
        @keyframes pulse {
            0% { transform: scale(1); opacity: 1; }
            100% { transform: scale(1.5); opacity: 0; }
        }

        @keyframes glitch {
            0% { transform: translate(0); }
            20% { transform: translate(-2px, 2px); }
            40% { transform: translate(-2px, -2px); }
            60% { transform: translate(2px, 2px); }
            80% { transform: translate(2px, -2px); }
            100% { transform: translate(0); }
        }

        @media (max-width: 480px) {
            .error-code { font-size: 5rem; }
            h2 { font-size: 1.2rem; }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="radar">
            <svg width="60" height="60" viewBox="0 0 24 24" fill="none" stroke="#d4c8b0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
            </svg>
        </div>
        
        <h1 class="error-code">403</h1>
        <h2>ACCESS FORBIDDEN</h2>
        
        <p>
            Sistem mendeteksi upaya akses tidak sah.<br>
            Identitas Anda tidak terverifikasi untuk area ini dan tidak cocok dengan pintu basecamp kami.<br><br>
            <b>Jalur ini khusus hanya untuk petualang yang terdaftar.</b>
        </p>

        <a href="/" class="btn-back">Kembali ke Beranda</a>
        <a href="/login.html" class="btn-back">Login Ulang</a>
    </div>

</body>
</html>
