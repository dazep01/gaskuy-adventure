<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Trip Story Generator Pro • Gaskuy Adventure</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html-to-image/1.11.1/html-to-image.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800;900&display=swap');

    * { font-family: 'Poppins', sans-serif; box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0b1120;
      background-image: 
        radial-gradient(at 0% 0%, rgba(249, 115, 22, 0.15) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(14, 165, 233, 0.1) 0px, transparent 50%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }

    .container-main {
      max-width: 1152px;
      width: 100%;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 1fr;
      gap: 2rem;
    }

    @media (min-width: 1024px) {
      .container-main {
        grid-template-columns: 1fr 1fr;
        gap: 3rem;
      }
    }

    /* ========== PANEL EDITOR ========== */
    .editor-panel {
      background-color: rgba(255, 255, 255, 0.95);
      color: #1e293b;
      padding: 1.5rem;
      border-radius: 1.5rem;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
      height: fit-content;
      border: 1px solid rgba(255, 237, 213, 0.5);
      backdrop-filter: blur(4px);
    }

    .editor-header {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 2rem;
    }

    .editor-icon {
      width: 2.5rem;
      height: 2.5rem;
      background: linear-gradient(to bottom right, #f97316, #ea580c);
      border-radius: 0.75rem;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 15px -3px rgba(249, 115, 22, 0.2);
      font-size: 1.25rem;
    }

    .editor-title h2 {
      font-size: 1.5rem;
      font-weight: 900;
      color: #ea580c;
      line-height: 1.25;
    }

    .editor-title p {
      font-size: 0.75rem;
      color: #94a3b8;
      font-weight: 500;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
      margin-bottom: 1.5rem;
    }

    .form-label {
      display: block;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      color: #64748b;
      margin-bottom: 0.375rem;
      letter-spacing: 0.05em;
    }

    .form-input {
      width: 100%;
      border: 2px solid #e2e8f0;
      padding: 0.75rem;
      border-radius: 0.75rem;
      outline: none;
      font-weight: 700;
      color: #334155;
      transition: all 0.2s;
    }

    .form-input:focus {
      border-color: #f97316;
      box-shadow: 0 0 0 4px rgba(249, 115, 22, 0.1);
    }

    .file-input {
      width: 100%;
      font-size: 0.75rem;
      margin-top: 0.25rem;
      cursor: pointer;
    }

    .file-input::-webkit-file-upload-button {
      margin-right: 0.75rem;
      padding: 0.625rem 1rem;
      border-radius: 0.75rem;
      border: 0;
      background-color: #fff7ed;
      color: #c2410c;
      font-weight: 600;
      cursor: pointer;
    }

    .file-input:hover::-webkit-file-upload-button {
      background-color: #ffedd5;
    }

    #tripContainer {
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
      max-height: 420px;
      overflow-y: auto;
      padding-right: 0.5rem;
      margin-bottom: 1.5rem;
    }

    #tripContainer::-webkit-scrollbar { width: 5px; }
    #tripContainer::-webkit-scrollbar-track { background: #f1f5f9; border-radius: 8px; }
    #tripContainer::-webkit-scrollbar-thumb { background: #f97316; border-radius: 8px; }

    .btn-base {
      width: 100%;
      border: none;
      cursor: pointer;
      font-weight: 700;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
    }

    .btn-add-group {
      background-color: #0f172a;
      color: white;
      padding: 0.875rem;
      border-radius: 0.75rem;
      margin-bottom: 1.25rem;
      box-shadow: 0 10px 15px -3px rgba(15, 23, 42, 0.2);
    }

    .btn-add-group:hover { background-color: #1e293b; }
    .btn-add-group span:first-child { transition: transform 0.2s; }
    .btn-add-group:hover span:first-child { transform: scale(1.1); }

    .action-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.75rem;
    }

    .btn-preview {
      background-color: #0ea5e9;
      color: white;
      padding: 1rem;
      border-radius: 0.75rem;
      font-weight: 900;
      box-shadow: 0 10px 15px -3px rgba(14, 165, 233, 0.25);
    }

    .btn-preview:hover { background-color: #0284c7; transform: translateY(-2px); }

    .btn-download {
      background: linear-gradient(to right, #f97316, #ea580c);
      color: white;
      padding: 1rem;
      border-radius: 0.75rem;
      font-weight: 900;
      box-shadow: 0 10px 15px -3px rgba(249, 115, 22, 0.25);
    }

    .btn-download:hover { 
      background: linear-gradient(to right, #ea580c, #c2410c);
      transform: translateY(-2px); 
    }

    .btn-base:active { transform: translateY(0); }

    /* ========== PANEL PREVIEW ========== */
    .preview-panel {
      position: sticky;
      top: 2rem;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* --- WRAPPER RESPONSIF UNTUK IPHONE --- */
    .canvas-viewport {
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      overflow: hidden;
    }

    .canvas-scaler {
      transform-origin: top center;
      will-change: transform;
    }

    .status-badge {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 1rem;
      background-color: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(4px);
      padding: 0.5rem 1rem;
      border-radius: 9999px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .pulse-dot {
      width: 0.5rem;
      height: 0.5rem;
      background-color: #4ade80;
      border-radius: 9999px;
      box-shadow: 0 0 8px rgba(74, 222, 128, 0.6);
      animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: .5; }
    }

    .status-text {
      font-size: 0.875rem;
      color: #cbd5e1;
      font-weight: 500;
    }

    /* Canvas asli 450x800 – TIDAK di-scale */
    .story-canvas {
      width: 450px;
      height: 800px;
      flex-shrink: 0;
      position: relative;
      overflow: hidden;
      background-color: #0f172a;
      border-radius: 2rem;
      box-shadow: 
        0 25px 50px -12px rgba(0, 0, 0, 0.7),
        0 0 0 1px rgba(255, 255, 255, 0.05);
      display: flex;
      flex-direction: column;
      align-items: center;
      color: white;
    }

    #previewBg {
      position: absolute;
      inset: 0;
      background-size: cover;
      background-position: center;
      transition: all 0.7s;
    }

    .bg-overlay {
      position: absolute;
      inset: 0;
      background: 
        linear-gradient(180deg, rgba(11, 17, 32, 0.3) 0%, transparent 30%, transparent 60%, rgba(11, 17, 32, 0.8) 100%),
        linear-gradient(135deg, rgba(249, 115, 22, 0.08) 0%, transparent 50%, rgba(14, 165, 233, 0.06) 100%);
      pointer-events: none;
      z-index: 1;
    }

    .vignette {
      position: absolute;
      inset: 0;
      box-shadow: inset 0 0 150px rgba(0,0,0,0.5);
      pointer-events: none;
      z-index: 2;
    }

    .content-canvas {
      position: relative;
      z-index: 10;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 1.75rem;
    }

    .header-canvas {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 0.5rem;
      flex-shrink: 0;
    }

    .logo-canvas {
      height: 3.5rem;
      margin-bottom: 0.25rem;
      filter: drop-shadow(0 10px 8px rgba(0, 0, 0, 0.2));
    }

    .tagline-canvas {
      font-style: italic;
      font-size: 10px;
      letter-spacing: 0.4em;
      font-weight: 600;
      text-transform: uppercase;
      color: rgba(254, 215, 170, 0.9);
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.7), 0 1px 3px rgba(0, 0, 0, 0.5);
    }

    .sub-tagline-canvas {
      font-size: 7px;
      color: rgba(255, 255, 255, 0.9);
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.7), 0 1px 3px rgba(0, 0, 0, 0.5);
    }

    .deco-line {
      width: 6rem;
      height: 2px;
      margin-bottom: 1rem;
      opacity: 0.6;
      flex-shrink: 0;
      background: linear-gradient(90deg, transparent, rgba(249, 115, 22, 0.5), rgba(14, 165, 233, 0.5), transparent);
    }

    .title-canvas {
      font-size: 2.5rem;
      font-weight: 900;
      font-style: italic;
      letter-spacing: -0.025em;
      margin-bottom: 1rem;
      text-align: center;
      line-height: 1;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.7), 0 1px 3px rgba(0, 0, 0, 0.5), 0 0 30px rgba(249, 115, 22, 0.3);
      flex-shrink: 0;
    }

    #displayMonth {
      color: #fb923c;
      font-style: normal;
      font-size: 1.875rem;
      font-weight: 900;
      border-radius: 9999px;
      background-color: rgba(0, 13, 72, 0.31);
      padding: 0 15px;
    }

    #tripsOuterWrapper {
      width: 100%;
      flex-shrink: 0;
      padding-top: 16px;
      box-sizing: border-box;
      overflow: visible;
    }

    #displayTrips {
      width: 100%;
      transform-origin: top center;
      will-change: transform;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .card-wrapper {
      position: relative;
      width: 100%;
      flex-shrink: 0;
      padding-top: 11px;
      margin-bottom: 20px;
    }

    .trip-card {
      background: rgba(15, 23, 42, 0.55);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 2px solid rgba(249, 115, 22, 0.25);
      border-radius: 1.5rem;
      padding: 20px 18px 16px;
      box-shadow: 
        0 8px 32px rgba(0, 0, 0, 0.4),
        inset 0 1px 0 rgba(255, 255, 255, 0.05);
    }

    .trip-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, rgba(249, 115, 22, 0.6), transparent);
    }

    .category-badge {
      position: absolute;
      top: 0;
      left: 24px;
      background: linear-gradient(135deg, #f97316 0%, #ea580c 100%);
      padding: 4px 16px;
      border-radius: 999px;
      font-size: 10px;
      font-weight: 900;
      font-style: italic;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: white;
      box-shadow: 0 4px 15px rgba(249, 115, 22, 0.4), 0 0 0 1px rgba(255,255,255,0.1);
      z-index: 1000;
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.75rem;
      border-bottom: 1px solid rgba(255,255,255,0.1);
      padding-bottom: 0.5rem;
      margin-top: 0.5rem;
    }

    .card-date {
      font-size: 11px;
      font-weight: 700;
      color: #fed7aa;
    }

    .card-date span { color: #fb923c; }

    .card-label {
      font-size: 11px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: rgba(255,255,255,0.4);
    }

    .trip-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 0.625rem;
    }

    .trip-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.75rem;
    }

    .trip-name {
      font-size: 10.5px;
      font-weight: 500;
      letter-spacing: 0.025em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 240px;
      color: #f1f5f9;
    }

    .seat-box {
      border-radius: 999px;
      min-width: 72px;
      height: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 9px;
      font-weight: 800;
      text-transform: uppercase;
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
    }

    .seat-available {
      background: linear-gradient(135deg, #fed7aa 0%, #fdba74 100%);
      color: #7c2d12;
    }

    .seat-full {
      background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
      color: white;
      animation: pulse-red 2s infinite;
    }

    .seat-low {
      background: linear-gradient(135deg, #fde047 0%, #facc15 100%);
      color: #713f12;
    }

    @keyframes pulse-red {
      0%, 100% { box-shadow: 0 2px 8px rgba(220, 38, 38, 0.3); }
      50% { box-shadow: 0 2px 16px rgba(220, 38, 38, 0.6); }
    }

    .footer-canvas {
      position: absolute;
      bottom: 0.75rem;
      left: 1.75rem;
      right: 1.75rem;
    }

    .contact-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.75rem;
    }

    .contact-chip {
      background: linear-gradient(135deg, rgba(249,115,22,0.56) 0%, rgba(234,88,9,0.05) 100%);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255,255,255,0.08);
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
      display: flex;
      align-items: center;
      gap: 0.5rem;
      color: white;
      padding: 0.375rem 1rem 0.375rem 0.375rem;
      border-radius: 9999px;
    }

    .chip-icon {
      border-radius: 9999px;
      width: 1.75rem;
      height: 1.75rem;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .icon-ig { background: linear-gradient(to bottom right, #fb923c, #ec4899); }
    .icon-wa { background-color: #10b981; }

    .chip-text {
      font-size: 11px;
      font-weight: 700;
    }

    .footer-divider {
      margin-top: 0.75rem;
      width: 100%;
      height: 1px;
      background: linear-gradient(to right, transparent, rgba(249,115,22,0.4), transparent);
    }

    .copyright {
      text-align: center;
      font-size: 9px;
      color: rgba(255,255,255,0.3);
      margin-top: 0.5rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    /* Input cards */
    .input-card {
      padding: 1.25rem;
      background-color: #f8fafc;
      border-radius: 1rem;
      border: 2px solid #e2e8f0;
      position: relative;
    }

    .btn-remove-group {
      position: absolute;
      top: 0.75rem;
      right: 0.75rem;
      color: #ef4444;
      font-weight: 700;
      font-size: 10px;
      background-color: white;
      padding: 0.25rem 0.625rem;
      border-radius: 9999px;
      box-shadow: 0 1px 2px rgba(0,0,0,0.05);
      border: 1px solid #fee2e2;
      cursor: pointer;
    }

    .input-card-header {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.75rem;
      margin-bottom: 1rem;
      padding-right: 4rem;
    }

    .input-mini-label {
      font-size: 9px;
      font-weight: 700;
      text-transform: uppercase;
      color: #94a3b8;
      margin-bottom: 0.25rem;
      display: block;
    }

    .input-title {
      font-weight: 700;
      font-size: 0.875rem;
      border: none;
      border-bottom: 2px solid #fdba74;
      background: transparent;
      text-transform: uppercase;
      outline: none;
      width: 100%;
    }

    .input-date {
      font-size: 0.75rem;
      border: none;
      border-bottom: 1px solid #cbd5e1;
      background: transparent;
      outline: none;
      width: 100%;
    }

    .items-container {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .items-header {
      display: grid;
      grid-template-columns: repeat(12, 1fr);
      gap: 0.5rem;
      margin-bottom: 0.5rem;
      font-size: 10px;
      font-weight: 700;
      color: #94a3b8;
      text-transform: uppercase;
    }

    .item-row {
      display: grid;
      grid-template-columns: repeat(12, 1fr);
      gap: 0.5rem;
      align-items: center;
    }

    .input-item-name {
      grid-column: span 8;
      font-size: 0.75rem;
      border: 1px solid #e2e8f0;
      padding: 0.5rem;
      border-radius: 0.5rem;
      outline: none;
      background: white;
    }

    .input-item-seat {
      grid-column: span 3;
      font-size: 0.75rem;
      border: 1px solid #fed7aa;
      padding: 0.5rem;
      border-radius: 0.5rem;
      background-color: rgba(255,247,237,0.5);
      font-weight: 700;
      color: #7c2d12;
      outline: none;
    }

    .btn-remove-item {
      grid-column: span 1;
      color: #f87171;
      font-weight: 700;
      border-radius: 0.5rem;
      height: 2rem;
      display: flex;
      align-items: center;
      justify-content: center;
      background: none;
      border: none;
      cursor: pointer;
    }

    .btn-add-item {
      margin-top: 1rem;
      font-size: 0.75rem;
      font-weight: 700;
      color: #0284c7;
      display: flex;
      align-items: center;
      gap: 0.375rem;
      background: none;
      border: none;
      cursor: pointer;
    }

    /* Modal & Loader */
    #modal {
      position: fixed;
      inset: 0;
      background-color: rgba(0, 0, 0, 0.9);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 50;
      padding: 1.5rem;
      backdrop-filter: blur(8px);
    }
    #modal.flex { display: flex; }
    .modal-container { max-width: 24rem; width: 100%; }
    #modalContent { border-radius: 1rem; overflow: hidden; }
    #modalContent img { width: 100%; display: block; }
    .btn-close-modal {
      width: 100%;
      margin-top: 1rem;
      background-color: rgba(255,255,255,0.1);
      backdrop-filter: blur(4px);
      border: 1px solid rgba(255,255,255,0.2);
      color: white;
      font-weight: 700;
      padding: 0.75rem;
      border-radius: 0.75rem;
      cursor: pointer;
    }

    #loader {
      position: fixed;
      inset: 0;
      background-color: rgba(0,0,0,0.6);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 9999;
    }
    #loader.flex { display: flex; }
    .loader-card {
      padding: 2rem;
      border-radius: 1.5rem;
      background-color: rgba(15,23,42,0.8);
      border: 1px solid rgba(255,255,255,0.1);
      text-align: center;
      color: white;
    }
    .spinner-container {
      width: 4rem;
      height: 4rem;
      margin: 0 auto 1rem;
      position: relative;
    }
    .spinner-bg {
      position: absolute;
      inset: 0;
      border: 4px solid rgba(249,115,22,0.2);
      border-radius: 9999px;
    }
    .spinner-active {
      position: absolute;
      inset: 0;
      border: 4px solid transparent;
      border-top-color: #f97316;
      border-radius: 9999px;
      animation: spin 1s linear infinite;
    }
    @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <div class="container-main">

    <!-- ========== PANEL EDITOR ========== -->
    <div class="editor-panel">
      <div class="editor-header">

        </button>
        <button onclick="downloadImage()" class="btn-base btn-download">
          <span><svg width="17" height="17" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48"><g fill="none"><path fill="#ffecd480" d="M30.923 23.191c1.666.276 3.178 1.268 3.893 2.934c.82 1.91.274 3.963-1.032 5.417a72 72 0 0 1-2.188 2.324c-1.828 1.862-3.289 3.038-4.387 3.781a5.67 5.67 0 0 1-6.418 0c-1.099-.743-2.56-1.92-4.387-3.781a72 72 0 0 1-2.19-2.325c-1.306-1.454-1.851-3.507-1.032-5.416c.715-1.667 2.228-2.66 3.895-2.934l.15-5.61c-3.706.093-6.52.254-8.526.407c-2.997.228-5.474 2.4-5.806 5.502C2.682 25.484 2.5 28.277 2.5 32s.182 6.516.395 8.51c.332 3.102 2.809 5.274 5.806 5.502c3.087.235 8.082.488 15.299.488s12.212-.253 15.299-.488c2.997-.228 5.474-2.4 5.806-5.502c.213-1.994.395-4.787.395-8.51s-.182-6.516-.395-8.51c-.332-3.102-2.809-5.274-5.806-5.502c-2.007-.153-4.82-.314-8.526-.407z"/><path fill="#ffffff" d="m27.999 26.044l-.441-16.427c-.035-1.291-.899-2.42-2.184-2.548a14 14 0 0 0-2.747 0c-1.286.129-2.15 1.257-2.185 2.549l-.44 16.426c-.794.02-1.489.044-2.096.072c-1.976.09-2.782 1.949-1.46 3.42c.57.636 1.262 1.376 2.1 2.229c1.71 1.744 3.02 2.785 3.926 3.398c.945.639 2.11.639 3.056 0c.906-.613 2.215-1.654 3.926-3.398a69 69 0 0 0 2.098-2.227c1.322-1.473.517-3.333-1.46-3.422c-.607-.028-1.3-.052-2.093-.072"/></g></svg></span> DOWNLOAD PNG
        </button>

    <!-- ========== AREA PREVIEW (CANVAS) ========== -->

  <!-- Modal -->
  <div id="modal">
    <div class="modal-container">
      <div id="modalContent"></div>
      <button onclick="closeModal()" class="btn-close-modal">TUTUP</button>
    </div>
  </div>

  <!-- Loader -->
  <div id="loader">
    <div class="loader-card">
      <div class="spinner-container">
        <div class="spinner-bg"></div>
        <div class="spinner-active"></div>
      </div>
      <div class="loader-text">
        <p>Sedang Memproses...</p>
        <p>Sabar ya, lagi bikin gambar HD buat kamu</p>
      </div>
    </div>
  </div>

  <script>
    // State aplikasi
    let trips = [
      {
        title: 'OPEN TRIP CAMP',
        date: '24 - 26 APRIL',
        items: [
          { name: 'Gunung Ciremai (Via Apuy)', seat: '4 SEAT' },
          { name: 'Gunung Gede (Via Putri)', seat: '5 SEAT' },
          { name: 'Gunung Lawu (Via Candi Cetho)', seat: '6 SEAT' },
          { name: 'Gunung Merbabu (Via Selo)', seat: '3 SEAT' },
          { name: 'Gunung Merbabu (Via Suwanting)', seat: 'PENUH' },
          { name: 'Gunung Merbabu (Thekelan)', seat: '2 SEAT' },
          { name: 'Gunung Prau (Via Patak Banteng)', seat: '7 SEAT' },
          { name: 'Gunung Prau (Via Wates)', seat: '4 SEAT' },
          { name: 'Gunung Raung (Via Kalibaru)', seat: '5 SEAT' },
          { name: 'Gunung Slamet (Via Bambangan)', seat: '6 SEAT' },
          { name: 'Gunung Slamet (Via Permadi Guci)', seat: '3 SEAT' },
          { name: 'Gunung Sindoro (Via Alang-alang)', seat: '4 SEAT' },
          { name: 'Gunung Sindoro (Via Kledung)', seat: '2 SEAT' },
          { name: 'Gunung Sumbing (Via Garung)', seat: '5 SEAT' },
          { name: 'Gunung Sumbing (Via Gajah Mungkur)', seat: '6 SEAT' }
        ]
      }
    ];

    const toggleLoader = (show) => {
      const loader = document.getElementById('loader');
      if (loader) loader.classList.toggle('flex', show);
    };

    function escapeHtml(text) {
      return String(text).replace(/[&<>"]/g, (m) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[m]));
    }

    // ========== SCALING RESPONSIF UNTUK IPHONE ==========
    function applyCanvasScale() {
      const scaler = document.getElementById('canvasScaler');
      if (!scaler) return;
      const CANVAS_WIDTH = 450;
      const padding = 16; // ruang horizontal
      const maxWidth = window.innerWidth - padding * 2;
      const scale = Math.min(1, maxWidth / CANVAS_WIDTH);
      scaler.style.transform = `scale(${scale})`;
    }

    // ========== GENERATE & DOWNLOAD ==========
    async function generatePreview() {
      const node = document.getElementById('captureArea');
      const modalContent = document.getElementById('modalContent');
      if (!node || !modalContent) {
        alert("Error: Elemen captureArea atau modal tidak ditemukan!");
        return;
      }

      toggleLoader(true);
      try {
        await new Promise(r => setTimeout(r, 200));
        const dataUrl = await htmlToImage.toPng(node, {
          pixelRatio: 2,
          cacheBust: true,
          skipFonts: false,
        });
        if (!dataUrl) throw new Error("Gagal menghasilkan gambar");

        const img = new Image();
        img.src = dataUrl;
        modalContent.innerHTML = '';
        modalContent.appendChild(img);
        document.getElementById('modal').classList.add('flex');
      } catch (error) {
        console.error(error);
        alert("Gagal Preview: " + error.message);
      } finally {
        toggleLoader(false);
      }
    }

    async function downloadImage() {
      const node = document.getElementById('captureArea');
      if (!node) return;

      toggleLoader(true);
      const originalRadius = node.style.borderRadius;
      const originalShadow = node.style.boxShadow;
      node.style.borderRadius = '0';
      node.style.boxShadow = 'none';

      try {
        await new Promise(r => setTimeout(r, 200));
        const dataUrl = await htmlToImage.toPng(node, {
          pixelRatio: 3,
          cacheBust: true,
          backgroundColor: '#0b1120'
        });
        const month = document.getElementById('inputMonth').value || 'TRIP';
        const link = document.createElement('a');
        link.download = `Gaskuy-Update-${month}.png`;
        link.href = dataUrl;
        link.click();
      } catch (error) {
        console.error(error);
        alert("Gagal Download: " + error.message);
      } finally {
        node.style.borderRadius = originalRadius;
        node.style.boxShadow = originalShadow;
        toggleLoader(false);
      }
    }

    // ========== EDITOR LOGIC ==========
    function renderInputs() {
      const container = document.getElementById('tripContainer');
      container.innerHTML = '';

      trips.forEach((trip, tIdx) => {
        const card = document.createElement('div');
        card.className = "input-card";
        card.innerHTML = `
          <button onclick="removeTrip(${tIdx})" class="btn-remove-group">HAPUS GRUP</button>

          <div class="input-card-header">
            <div>
              <label class="input-mini-label">Kategori</label>
              <input type="text" oninput="updateTripData(${tIdx}, 'title', this.value)" value="${escapeHtml(trip.title)}" 
                class="input-title" placeholder="Nama Kategori">
            </div>
            <div>
              <label class="input-mini-label">Tanggal</label>
              <input type="text" oninput="updateTripData(${tIdx}, 'date', this.value)" value="${escapeHtml(trip.date)}" 
                class="input-date" placeholder="Tanggal">
            </div>
          </div>

          <div class="items-container" id="items-${tIdx}">
            <div class="items-header">
              <div style="grid-column: span 8;">Destinasi</div>
              <div style="grid-column: span 3;">Status</div>
            </div>
            ${trip.items.map((item, iIdx) => `
              <div class="item-row">
                <input type="text" placeholder="Nama Gunung" oninput="updateItemData(${tIdx}, ${iIdx}, 'name', this.value)" value="${escapeHtml(item.name)}" 
                  class="input-item-name">
                <input type="text" placeholder="Sisa" oninput="updateItemData(${tIdx}, ${iIdx}, 'seat', this.value)" value="${escapeHtml(item.seat)}" 
                  class="input-item-seat">
                <button onclick="removeItem(${tIdx}, ${iIdx})" class="btn-remove-item">×</button>
              </div>
            `).join('')}
          </div>
          <button onclick="addItem(${tIdx})" class="btn-add-item">
            <span>+</span>
            <span>Tambah Destinasi</span>
          </button>
        `;
        container.appendChild(card);
      });
      updatePreview();
    }

    function getSeatClass(seatText) {
      const text = String(seatText).toUpperCase().trim();
      if (text === 'PENUH' || text === '0' || text === '0 SEAT') return 'seat-full';
      const match = text.match(/\d+/);
      if (match) {
        const num = parseInt(match[0]);
        if (num <= 3) return 'seat-low';
      }
      return 'seat-available';
    }

    function updatePreview() {
      document.getElementById('displayMonth').innerText = document.getElementById('inputMonth').value || 'APRIL';
      const display = document.getElementById('displayTrips');
      display.innerHTML = '';
      display.style.transform = 'none';

      trips.forEach(trip => {
        const cardWrapper = document.createElement('div');
        cardWrapper.className = "card-wrapper";
        cardWrapper.innerHTML = `
          <div class="category-badge">${escapeHtml(trip.title)}</div>
          <div class="trip-card">
            <div class="card-header">
              <span class="card-date"><span><svg width="15" height="15" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48"><g fill="none"><path fill="#ffecd4" d="M24 46.5c-7.632 0-12.948-.485-16.147-.911c-2.862-.382-5.068-2.554-5.479-5.419c-.417-2.91-.874-7.506-.874-13.67s.457-10.76.874-13.67c.41-2.864 2.617-5.037 5.48-5.418C11.051 6.985 16.367 6.5 24 6.5c7.632 0 12.948.485 16.147.912c2.862.381 5.068 2.554 5.479 5.418c.417 2.91.874 7.506.874 13.67s-.457 10.76-.874 13.67c-.41 2.864-2.617 5.037-5.48 5.419c-3.198.426-8.514.911-16.146.911"/><path fill="#ea580c" d="M33.5 14.518q-.754-.001-1.336-.037c-2.27-.133-3.547-2.002-3.618-3.918a69 69 0 0 1 0-5.091c.07-1.916 1.348-3.785 3.618-3.918q.582-.035 1.336-.036t1.336.036c2.27.133 3.547 2.002 3.618 3.918a69 69 0 0 1 0 5.091c-.07 1.916-1.348 3.785-3.618 3.918a23 23 0 0 1-1.336.037m-19 0q-.754-.001-1.336-.037c-2.27-.133-3.547-2.002-3.618-3.918a69 69 0 0 1 0-5.091c.07-1.916 1.348-3.785 3.618-3.918q.582-.035 1.336-.036t1.336.036c2.27.133 3.547 2.002 3.618 3.918a69 69 0 0 1 0 5.091c-.07 1.916-1.348 3.785-3.618 3.918a23 23 0 0 1-1.336.037"/><path fill="#ea580c" fill-rule="evenodd" d="M17 25a2 2 0 0 0-2-2h-4a2 2 0 1 0 0 4h4a2 2 0 0 0 2-2m5-2a2 2 0 1 0 0 4h4a2 2 0 1 0 0-4zm11 0a2 2 0 1 0 0 4h4a2 2 0 1 0 0-4zM22 33a2 2 0 1 0 0 4h4a2 2 0 1 0 0-4zm9 2a2 2 0 0 1 2-2h4a2 2 0 1 1 0 4h-4a2 2 0 0 1-2-2m-16-2a2 2 0 1 1 0 4h-4a2 2 0 1 1 0-4z" clip-rule="evenodd"/></g></svg></span> ${escapeHtml(trip.date)}</span>
              <span class="card-label">Sisa Seat</span>
            </div>
            <ul class="trip-list">
              ${trip.items.map(item => `
                <li class="trip-item">
                  <span class="trip-name">• ${escapeHtml(item.name)}</span>
                  <div class="seat-box ${getSeatClass(item.seat)}">${escapeHtml(item.seat) || '0'}</div>
                </li>
              `).join('')}
            </ul>
          </div>
        `;
        display.appendChild(cardWrapper);
      });

      requestAnimationFrame(() => {
        applyAutoScale();
        applyCanvasScale();
      });
    }

    function applyAutoScale() {
      const canvas = document.getElementById('captureArea');
      const outerWrapper = document.getElementById('tripsOuterWrapper');
      const tripsContainer = document.getElementById('displayTrips');
      const footer = document.getElementById('storyFooter');
      const title = canvas.querySelector('.title-canvas');

      tripsContainer.style.transform = 'none';
      outerWrapper.style.maxHeight = 'none';
      outerWrapper.style.marginBottom = '0';

      const canvasHeight = 800;
      const titleRect = title.getBoundingClientRect();
      const canvasRect = canvas.getBoundingClientRect();
      const headerBottom = titleRect.bottom - canvasRect.top;
      const footerHeight = footer.offsetHeight;
      const footerBottomOffset = 12;
      const gap = 16;

      const footerTop = canvasHeight - footerBottomOffset - footerHeight;
      const availableForWrapper = footerTop - headerBottom - gap;
      const naturalHeight = tripsContainer.scrollHeight;
      const wrapperPaddingTop = 16;

      if (naturalHeight > 0 && naturalHeight > (availableForWrapper - wrapperPaddingTop)) {
        const availableForCards = availableForWrapper - wrapperPaddingTop;
        const scale = availableForCards / naturalHeight;
        tripsContainer.style.transform = `scale(${scale})`;
        outerWrapper.style.maxHeight = availableForWrapper + 'px';
      }
    }

    function addTripGroup() {
      trips.push({ 
        title: 'ONE DAY TRIP', 
        date: '24 & 26 APRIL', 
        items: [{ name: 'Nama Destinasi', seat: '6 SEAT' }] 
      });
      renderInputs();
    }

    function removeTrip(index) {
      if (trips.length <= 1) return alert('Minimal satu kategori trip diperlukan.');
      trips.splice(index, 1);
      renderInputs();
    }

    function addItem(tIdx) {
      trips[tIdx].items.push({ name: '', seat: '' });
      renderInputs();
    }

    function removeItem(tIdx, iIdx) {
      if (trips[tIdx].items.length <= 1) return alert('Setiap kategori minimal punya satu destinasi.');
      trips[tIdx].items.splice(iIdx, 1);
      renderInputs();
    }

    function updateTripData(index, field, value) {
      trips[index][field] = value;
      updatePreview();
    }

    function updateItemData(tIdx, iIdx, field, value) {
      trips[tIdx].items[iIdx][field] = value;
      updatePreview();
    }

    // Event listeners
    document.getElementById('bgUpload').addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(ev) {
        document.getElementById('previewBg').style.backgroundImage = `url(${ev.target.result})`;
      };
      reader.readAsDataURL(file);
    });

    document.getElementById('inputMonth').addEventListener('input', updatePreview);
    window.addEventListener('resize', () => {
      requestAnimationFrame(() => {
        applyAutoScale();
        applyCanvasScale();
      });
    });

    function closeModal() {
      document.getElementById('modal').classList.remove('flex');
    }

    // Init
    renderInputs();
    applyCanvasScale();
  </script>
</body>
</html>
