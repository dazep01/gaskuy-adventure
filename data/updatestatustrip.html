  <style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800;900&display=swap');

    * { font-family: 'Poppins', sans-serif; box-sizing: border-box; }

    body {
      background: #0b1120;
      background-image: 
        radial-gradient(at 0% 0%, rgba(249, 115, 22, 0.15) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(14, 165, 233, 0.1) 0px, transparent 50%);
    }

    /* ========== STORY CANVAS: 450x800 (9:16) = IG Story Ratio ========== */
    .story-canvas {
      width: 450px;
      height: 800px;
      position: relative;
      overflow: hidden;
      background-color: #0f172a;
      border-radius: 2rem;
      box-shadow: 
        0 25px 50px -12px rgba(0, 0, 0, 0.7),
        0 0 0 1px rgba(255, 255, 255, 0.05);
    }

    /* ========== GLASS CARD V2 ========== */
    .trip-card {
      background: rgba(15, 23, 42, 0.55);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 2px solid rgba(249, 115, 22, 0.25);
      border-radius: 1.5rem;
      padding: 20px 18px 16px;
      margin-bottom: 20px;
      box-shadow: 
        0 8px 32px rgba(0, 0, 0, 0.4),
        inset 0 1px 0 rgba(255, 255, 255, 0.05);
      position: relative;
      overflow: visible;
      flex-shrink: 0;
    }

    .trip-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, rgba(249, 115, 22, 0.6), transparent);
    }

    /* ========== BADGE KATEGORI ========== */
    .category-badge {
      position: absolute;
      top: -11px;
      left: 24px;
      background: linear-gradient(135deg, #f97316 0%, #ea580c 100%);
      padding: 4px 16px;
      border-radius: 999px;
      font-size: 10px;
      font-weight: 900;
      font-style: italic;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: white;
      box-shadow: 
        0 4px 15px rgba(249, 115, 22, 0.4),
        0 0 0 1px rgba(255, 255, 255, 0.1);
      z-index: 1000;
    }

    /* ========== SEAT BADGE ========== */
    .seat-box {
      border-radius: 999px;
      min-width: 72px;
      height: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 9px;
      font-weight: 800;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
      transition: all 0.2s;
      flex-shrink: 0;
    }

    .seat-available {
      background: linear-gradient(135deg, #fed7aa 0%, #fdba74 100%);
      color: #7c2d12;
      border: 1px solid rgba(251, 146, 60, 0.3);
    }

    .seat-full {
      background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
      color: white;
      border: 1px solid rgba(239, 68, 68, 0.4);
      animation: pulse-red 2s infinite;
    }

    .seat-low {
      background: linear-gradient(135deg, #fde047 0%, #facc15 100%);
      color: #713f12;
      border: 1px solid rgba(250, 204, 21, 0.3);
    }

    @keyframes pulse-red {
      0%, 100% { box-shadow: 0 2px 8px rgba(220, 38, 38, 0.3); }
      50% { box-shadow: 0 2px 16px rgba(220, 38, 38, 0.6); }
    }

    .shadow-text {
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.7), 0 1px 3px rgba(0, 0, 0, 0.5);
    }

    /* ========== SCROLL EDITOR ========== */
    #tripContainer::-webkit-scrollbar { width: 5px; }
    #tripContainer::-webkit-scrollbar-track { background: #f1f5f9; border-radius: 8px; }
    #tripContainer::-webkit-scrollbar-thumb { background: #f97316; border-radius: 8px; }

    /* ========== BUTTONS ========== */
    .btn-action {
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      letter-spacing: 0.5px;
    }
    .btn-action:hover { transform: translateY(-2px); }
    .btn-action:active { transform: translateY(0); }

    /* ========== FOOTER CHIPS ========== */
    .contact-chip {
      background: linear-gradient(135deg, #f9731690 0%, #ea58090c 100%);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
    }

    /* ========== MODAL ========== */
    #modal { backdrop-filter: blur(8px); }

    /* ========== BACKGROUND OVERLAY ========== */
    .bg-overlay {
      position: absolute;
      inset: 0;
      background: 
        linear-gradient(180deg, rgba(11, 17, 32, 0.3) 0%, transparent 30%, transparent 60%, rgba(11, 17, 32, 0.8) 100%),
        linear-gradient(135deg, rgba(249, 115, 22, 0.08) 0%, transparent 50%, rgba(14, 165, 233, 0.06) 100%);
      pointer-events: none;
      z-index: 1;
    }

    .vignette {
      position: absolute;
      inset: 0;
      box-shadow: inset 0 0 150px rgba(0,0,0,0.5);
      pointer-events: none;
      z-index: 2;
    }

    .deco-line {
      height: 2px;
      background: linear-gradient(90deg, transparent, rgba(249, 115, 22, 0.5), rgba(14, 165, 233, 0.5), transparent);
    }

    .glow-text {
      text-shadow: 0 0 30px rgba(249, 115, 22, 0.3);
    }

    /* ========== SCALED TRIPS CONTAINER ========== */
/* Wrapper luar TIDAK diskalakan, hanya memberi ruang */
#tripsOuterWrapper {
  padding-top: 16px;
  box-sizing: border-box;
  overflow: visible;
}

/* Kontainer kartu yang akan diskalakan */
#displayTrips {
  width: 100%;
  transform-origin: top center;
  will-change: transform;
  overflow: visible !important; /* agar badge tetap terlihat */
  box-sizing: border-box;
}
  </style>

// 1. Pastikan fungsi pendukung ada di paling atas agar terbaca duluan
const toggleLoader = (show) => {
  const loader = document.getElementById('loader');
  if (!loader) return; // Mencegah error jika HTML loader lupa dicopy
  if (show) {
    loader.classList.remove('hidden');
    loader.classList.add('flex');
  } else {
    loader.classList.remove('flex');
    loader.classList.add('hidden');
  }
};

// Fungsi pembantu untuk membersihkan teks
function escapeHtml(text) {
  return String(text).replace(/[&<>"]/g, (m) => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'
  }[m]));
}

// 2. Fungsi Utama Preview
async function generatePreview() {
  const node = document.getElementById('captureArea');
  const modalContent = document.getElementById('modalContent');
  
  if (!node || !modalContent) {
    alert("Error: Elemen captureArea atau modal tidak ditemukan!");
    return;
  }

  toggleLoader(true); // Munculkan spinner

  try {
    // Beri waktu 200ms agar browser merender spinner-nya dulu
    await new Promise(r => setTimeout(r, 200));

    // Pastikan memanggil 'htmlToImage' dengan benar
    const dataUrl = await htmlToImage.toPng(node, {
      pixelRatio: 2,
      cacheBust: true,
      skipFonts: false,
    });

    if (!dataUrl) throw new Error("Gagal menghasilkan gambar (DataURL kosong)");

    const img = new Image();
    img.src = dataUrl;
    img.className = "w-full rounded-lg";
    
    modalContent.innerHTML = '';
    modalContent.appendChild(img);
    
    document.getElementById('modal').classList.replace('hidden', 'flex');

  } catch (error) {
    console.error("Detail Error:", error);
    alert("Gagal Preview: " + error.message);
  } finally {
    toggleLoader(false); // Matikan spinner
  }
}

// 3. Fungsi Utama Download
async function downloadImage() {
  const node = document.getElementById('captureArea');
  if (!node) return;

  toggleLoader(true);

  try {
    await new Promise(r => setTimeout(r, 200));

    const dataUrl = await htmlToImage.toPng(node, {
      pixelRatio: 3, // Kualitas lebih tinggi untuk download
      cacheBust: true
    });

    const month = document.getElementById('inputMonth').value || 'TRIP';
    const link = document.createElement('a');
    link.download = `Gaskuy-Update-${month}.png`;
    link.href = dataUrl;
    link.click();

  } catch (error) {
    console.error("Detail Error:", error);
    alert("Gagal Download: " + error.message);
  } finally {
    toggleLoader(false);
  }
}

// Fungsi render dan data lainnya tetap sama seperti sebelumnya...
// (Pastikan sisa fungsi seperti addTripGroup, renderInputs, dll ada di bawah sini)

    function renderInputs() {

            </div>

          <div class="space-y-2" id="items-${tIdx}">
            <div class="grid grid-cols-12 gap-2 mb-2 text-[10px] font-bold text-slate-400 uppercase tracking-wider">
              <div class="col-span-8">Destinasi</div>
              <div class="col-span-3">Status</div>

            ${trip.items.map((item, iIdx) => `
              <div class="grid grid-cols-12 gap-2 items-center group">
                <input type="text" placeholder="Nama Gunung" oninput="updateItemData(${tIdx}, ${iIdx}, 'name', this.value)" value="${escapeHtml(item.name)}"

                <input type="text" placeholder="Sisa" oninput="updateItemData(${tIdx}, ${iIdx}, 'seat', this.value)" value="${escapeHtml(item.seat)}" 
                  class="col-span-3 text-xs border border-orange-200 p-2 rounded-lg bg-orange-50/50 font-bold text-orange-900 focus:border-orange-400 focus:ring-2 focus:ring-orange-500/10 outline-none transition-all">
                <button onclick="removeItem(${tIdx}, ${iIdx})" 
                  class="col-span-1 text-red-400 font-bold hover:text-red-600 hover:bg-red-50 rounded-lg h-8 transition flex items-center justify-center">×</button>
              </div>
            `).join('')}
          </div>
          <button onclick="addItem(${tIdx})" class="mt-4 text-xs font-bold text-sky-600 hover:text-sky-700 flex items-center gap-1.5 hover:gap-2 transition-all">
            <span class="bg-sky-100 text-sky-600 rounded-full w-5 h-5 flex items-center justify-center text-[10px]">+</span>
            <span>Tambah Destinasi</span>
          </button>
        `;
        container.appendChild(card);
      });
      updatePreview();
    }

    function escapeHtml(text) {
      return String(text).replace(/[&<>"]/g, function(m) {
        if (m === '&') return '&amp;';
        if (m === '<') return '&lt;';
        if (m === '>') return '&gt;';
        if (m === '"') return '&quot;';
        return m;
      });
    }

    function getSeatClass(seatText) {
      const text = String(seatText).toUpperCase().trim();
      if (text === 'PENUH' || text === '0' || text === '0 SEAT') return 'seat-full';
      const match = text.match(/\d+/);
      if (match) {
        const num = parseInt(match[0]);
        if (num <= 3) return 'seat-low';
      }
      return 'seat-available';
    }

    // ========== AUTO SCALE LOGIC ==========
    function updatePreview() {
      document.getElementById('displayMonth').innerText = document.getElementById('inputMonth').value || 'APRIL';

      const display = document.getElementById('displayTrips');
      display.innerHTML = '';
      display.style.transform = 'none';

    trips.forEach(trip => {
      // 1. Buat elemen wrapper baru
      const cardWrapper = document.createElement('div');
      cardWrapper.className = "relative w-full flex-shrink-0";
      // Kita beri ruang atas 11px, dan pindahkan jarak antar kartu ke wrapper
      cardWrapper.style.paddingTop = "11px";
      cardWrapper.style.marginBottom = "20px";

      cardWrapper.innerHTML = `
        <div class="category-badge" style="top: 0;">${escapeHtml(trip.title)}</div>
        
        <div class="trip-card text-left" style="margin-bottom: 0;">
          <div class="flex justify-between items-center mb-3 border-b border-white/10 pb-2 mt-2">
            <span class="text-[11px] font-bold tracking-tight flex items-center gap-1.5 text-orange-200">
              <span class="text-orange-400">📅</span> ${escapeHtml(trip.date)}
            </span>
            <span class="text-[11px] font-black uppercase tracking-widest text-white/40">Sisa Seat</span>
          </div>
          <ul class="space-y-2.5">
            ${trip.items.map(item => `
              <li class="flex justify-between items-center gap-3">
                <span class="text-[10.5px] font-medium tracking-wide truncate max-w-[240px] text-slate-100 leading-tight">• ${escapeHtml(item.name)}</span>
                <div class="seat-box ${getSeatClass(item.seat)}">${escapeHtml(item.seat) || '0'}</div>
              </li>
            `).join('')}
          </ul>
        </div>
      `;
      display.appendChild(cardWrapper);
    });

      // Hitung dan apply scale setelah render
      requestAnimationFrame(() => {
        applyAutoScale();
      });
    }

function applyAutoScale() {
  const canvas = document.getElementById('captureArea');
  const outerWrapper = document.getElementById('tripsOuterWrapper');
  const tripsContainer = document.getElementById('displayTrips');
  const contentWrapper = canvas.querySelector('.relative.z-10');
  const footer = document.getElementById('storyFooter');
  const h1 = contentWrapper.querySelector('h1');

  // Reset dulu biar ukuran natural bisa diukur
  tripsContainer.style.transform = 'none';
  tripsContainer.style.maxHeight = 'none';
  outerWrapper.style.maxHeight = 'none';
  outerWrapper.style.marginBottom = '0';

  const canvasRect = canvas.getBoundingClientRect();
  const canvasHeight = canvasRect.height;          // 800px
  const headerBottom = h1.getBoundingClientRect().bottom - canvasRect.top;
  const footerHeight = footer.offsetHeight;
  const footerMarginBottom = 28;                  // bottom-7
  const gap = 16;                                 // jarak antara header & kartu

  const footerTop = canvasHeight - footerMarginBottom - footerHeight;
  // Ruang yang tersedia untuk outerWrapper (termasuk padding-top)
  const availableForWrapper = footerTop - headerBottom - gap;

  // Natural height dari konten kartu saja (tanpa padding wrapper)
  const naturalHeight = tripsContainer.scrollHeight;

  // Padding wrapper yang tetap (tidak di-scale)
  const wrapperPaddingTop = 16;

  if (naturalHeight > 0 && naturalHeight > (availableForWrapper - wrapperPaddingTop)) {
    const availableForCards = availableForWrapper - wrapperPaddingTop;
    const scale = availableForCards / naturalHeight;

    // Terapkan scale pada tripsContainer
    tripsContainer.style.transform = `scale(${scale})`;
    tripsContainer.style.transformOrigin = 'top center';

    // Batasi tinggi outer wrapper agar tidak meluber ke footer
    outerWrapper.style.maxHeight = availableForWrapper + 'px';
    outerWrapper.style.marginBottom = '0';
  } else {
    // Konten cukup pendek, tidak perlu scale
    tripsContainer.style.transform = 'none';
    outerWrapper.style.maxHeight = 'none';
  }
}

    function addTripGroup() {
      trips.push({ 
        title: 'ONE DAY TRIP', 
        date: '24 & 26 APRIL', 
        items: [{ name: 'Nama Destinasi', seat: '6 SEAT' }] 
      });
      renderInputs();
    }

    function removeTrip(index) {
      if (trips.length <= 1) return alert('Minimal satu kategori trip diperlukan.');
      trips.splice(index, 1);
      renderInputs();
    }

    function addItem(tIdx) {
      trips[tIdx].items.push({ name: '', seat: '' });
      renderInputs();
    }

    function removeItem(tIdx, iIdx) {
      if (trips[tIdx].items.length <= 1) return alert('Setiap kategori minimal punya satu destinasi.');
      trips[tIdx].items.splice(iIdx, 1);
      renderInputs();
    }

    function updateTripData(index, field, value) {
      trips[index][field] = value;
      updatePreview();
    }

    function updateItemData(tIdx, iIdx, field, value) {
      trips[tIdx].items[iIdx][field] = value;
      updatePreview();
    }

    document.getElementById('bgUpload').addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(ev) {
        document.getElementById('previewBg').style.backgroundImage = `url(${ev.target.result})`;
      };
      reader.readAsDataURL(file);
    });

    document.getElementById('inputMonth').addEventListener('input', updatePreview);

    // Re-scale saat resize window
    window.addEventListener('resize', () => {
      requestAnimationFrame(applyAutoScale);
    });

    function closeModal() {
      document.getElementById('modal').classList.replace('flex', 'hidden');
    }

    renderInputs();
  </script>
</body>
