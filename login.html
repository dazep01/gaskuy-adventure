<!DOCTYPE html>
<html lang="in">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - GasKuy Adventure</title>
  <link href="https://fonts.googleapis.com/css2?family=SF+Pro+Display:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.hugeicons.com/font/hgi-stroke-rounded.css">
  
  <style>
    :root {
      --earth-cream: #f5f1e8;
      --earth-sage: #d4c8b0;
      --earth-mist: #e8e3da;
      --earth-wood: #a6957a;
      --earth-soil: #8d7a66;
      --earth-charcoal: #5a4f41;
      --earth-warm-white: #fdfaf7;
      --ios-shadow: 0 4px 12px rgba(0, 0, 0, 0.05);
      --radius-large: 24px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'SF Pro Display', -apple-system, sans-serif;
      height: 100vh;
      width: 100vw;
      background-image: url('https://images.unsplash.com/photo-1519681393784-d120267933ba?q=80&w=2070&auto=format&fit=crop'); /* Gambar Gunung Estetik */
      background-size: cover;
      background-position: center;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    /* Overlay Gelap agar tulisan terbaca */
    body::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, rgba(90, 79, 65, 0.9), rgba(90, 79, 65, 0.4));
      z-index: 1;
    }

    .login-card {
      position: relative;
      z-index: 10;
      background: rgba(253, 250, 247, 0.90); /* Glassmorphism Warm White */
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      padding: 40px 30px;
      border-radius: 32px;
      width: 90%;
      max-width: 400px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.2);
      border: 1px solid rgba(255,255,255,0.3);
      animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .brand-header {
      text-align: center;
      margin-bottom: 30px;
    }

    .logo-img {
      width: 60px;
      height: 60px;
      background: var(--earth-charcoal);
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 15px;
      color: var(--earth-cream);
      font-size: 2rem;
    }

    .welcome-text {
      color: var(--earth-charcoal);
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 5px;
    }

    .sub-text {
      color: var(--earth-soil);
      font-size: 0.95rem;
    }

    .input-group {
      margin-bottom: 20px;
      position: relative;
    }

    .input-field {
      width: 100%;
      padding: 16px 50px 16px 20px;
      border: 2px solid var(--earth-mist);
      background: white;
      border-radius: 50px;
      font-size: 1rem;
      color: var(--earth-charcoal);
      transition: all 0.3s ease;
      outline: none;
    }

    .input-field:focus {
      border-color: var(--earth-soil);
      box-shadow: 0 0 0 4px rgba(141, 122, 102, 0.1);
    }

    .input-icon {
      position: absolute;
      right: 20px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--earth-wood);
      cursor: pointer;
    }

    .action-btn {
      width: 100%;
      padding: 16px;
      background: var(--earth-charcoal);
      color: white;
      border: none;
      border-radius: 50px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s, background 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-top: 10px;
    }

    .action-btn:hover {
      background: var(--earth-soil);
      transform: translateY(-2px);
    }

    .action-btn:active {
      transform: scale(0.98);
    }

    .divider {
      display: flex;
      align-items: center;
      margin: 25px 0;
      color: var(--earth-wood);
      font-size: 0.8rem;
    }

    .divider::before, .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--earth-mist);
    }
    .divider span { margin: 0 10px; }

    .social-login {
      display: flex;
      gap: 15px;
      justify-content: center;
    }

    .social-btn {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      border: 1px solid var(--earth-mist);
      background: white;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s;
      font-size: 1.2rem;
      color: var(--earth-charcoal);
    }

    .social-btn:hover {
      background: var(--earth-cream);
      border-color: var(--earth-soil);
    }

    .footer-link {
      text-align: center;
      margin-top: 25px;
      font-size: 0.9rem;
      color: var(--earth-wood);
    }

    .footer-link a {
      color: var(--earth-soil);
      text-decoration: none;
      font-weight: 600;
    }

    /* Loading Spinner */
    .spinner {
      width: 20px;
      height: 20px;
      border: 3px solid rgba(255,255,255,0.3);
      border-radius: 50%;
      border-top-color: white;
      animation: spin 0.8s linear infinite;
      display: none;
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(40px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Alert Style */
    .alert-box {
      background: #ffe5e5;
      color: #d63031;
      padding: 12px;
      border-radius: 12px;
      font-size: 0.85rem;
      margin-bottom: 15px;
      display: none;
      text-align: center;
      border: 1px solid #ffcece;
    }
  </style>
</head>
<body>

  <div class="login-card">
    <div class="brand-header">
      <div class="logo-img">
        <i class="hgi hgi-stroke hgi-mountain"></i>
      </div>
      <h1 class="welcome-text">GasKuy Lagi!</h1>
      <p class="sub-text">Lanjutkan petualanganmu sekarang.</p>
    </div>

    <div class="alert-box" id="alertBox">Email atau password salah!</div>

    <form id="loginForm" onsubmit="handleLogin(event)">
      <div class="input-group">
        <input type="email" class="input-field" placeholder="Email Petualang" required id="email">
        <i class="hgi hgi-stroke hgi-mail-02 input-icon"></i>
      </div>

      <div class="input-group">
        <input type="password" class="input-field" placeholder="Password" required id="password">
        <i class="hgi hgi-stroke hgi-view-off input-icon" id="togglePass" onclick="togglePassword()"></i>
      </div>

      <div style="text-align: right; margin-bottom: 20px;">
        <a href="#" style="color: var(--earth-wood); font-size: 0.85rem; text-decoration: none;">Lupa Password?</a>
      </div>

      <button type="submit" class="action-btn" id="loginBtn">
        <span id="btnText">Masuk Sekarang</span>
        <div class="spinner" id="btnLoader"></div>
      </button>
    </form>

    <div class="divider"><span>ATAU MASUK DENGAN</span></div>

    <div class="social-login">
      <button class="social-btn"><i class="hgi hgi-stroke hgi-google"></i></button>
      <button class="social-btn"><i class="hgi hgi-stroke hgi-apple"></i></button>
    </div>

    <div class="footer-link">
      Belum punya akun? <a href="#">Daftar disini</a>
    </div>
  </div>
